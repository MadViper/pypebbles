[project]
name = "pypebbles"
version = "0.1.2"
description = "Python Pebbles"
authors = [
    {name = "Mike Pebbles", email = "mq.pebbles@gmail.com"}
]
readme = "README.md"
dynamic = ["dependencies"]
requires-python = ">=3.12,<4"

[tool.poetry.dependencies]

[tool.poetry.group.dev.dependencies]
apexcodexpy = "0.6.6"
pytest = "*"
pytest-cov = "*"


[tool.coverage.run]
branch = true
source = [
    "pypebbles",
    "tests",
]

[tool.coverage.report]
skip_empty = true
skip_covered = true
show_missing = true
