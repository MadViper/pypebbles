[project]
name = "pypebbles"
version = "0.4.1"
description = "Python Pebbles"
readme = "README.md"
authors = [ { name = "Mike Pebbles", email = "mq.pebbles@gmail.com" } ]
requires-python = ">=3.12,<4"
dynamic = [ "dependencies" ]

[tool.poetry.dependencies]
bcrypt = "*"
httpx2 = "*"
pyjwt = "*"

[tool.poetry.group.dev.dependencies]
apexcodexpy = "0.8.*"
faker = "*"
hypothesis = "*"
pytest = "*"
pytest-cov = "*"
pytest-recording = "*"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "FBT",
    "FLY",
    "FURB",
    "I",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "SLF",
    "T20",
    "TCH",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "PLR2004",
    "TRY003",
]

[tool.mypy]
ignore_missing_imports = true
strict = true
pretty = true
show_error_codes = true

[tool.coverage.run]
source = [
    "pypebbles",
    "tests",
]
branch = true

[tool.coverage.report]
skip_covered = true
skip_empty = true
show_missing = true
